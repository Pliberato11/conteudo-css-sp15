<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style03.css">
    <title>Conteúdo Aula05 - CSS</title>
  </head>
  <body>
  <h1>Itens Flexíveis na Flexbox</h1>
    <h3>Propriedade order</h3>
    <div class="order">
      <div style="order: 4;">Item1</div>
      <div style="order: 1;">Item2</div>
      <div style="order: 2;">Item3</div>
      <div style="order: 3;">Item4</div>
    </div>

    <hr>

      <h3>Propriedade flex-grow</h3>
      <div class="flex-grow">
        <div style="flex-grow: 1;">Item1</div>
        <div style="flex-grow: 1;">Item2</div>
        <div style="flex-grow: 4;">Item3</div>
      </div>

    <hr>

      <h3>Propriedade flex-shrink</h3>
      <div class="flex-shrink">
        <div>Item1</div>
        <div style="flex-shrink: 4;">Item2</div>
        <div>Item3</div>
        <div>Item4</div>
      </div>

    <hr>

        <h3>Propriedade flex-basis</h3>
        <div class="flex-basis">
          <div>Item 1</div>
          <div style="flex-basis: 250px;">Item 2</div>
          <div>Item 3</div>
          <div>Item 4</div>
        </div>

  </body>
</html>
